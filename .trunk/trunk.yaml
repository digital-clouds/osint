version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  disabled:
    - yamllint
  enabled:
    - grype@0.110.0
    - pinact@4.0.0
    - checkov@3.3.12
    - osv-scanner@2.3.5
    - trufflehog@3.95.2
    - actionlint@1.7.12
    - git-diff-check
    - gitleaks@8.29.0
    - markdownlint@0.49.1
    - oxipng@10.1.1
    - prettier@3.9.6
    - taplo@0.10.0

runtimes:
  enabled:
    - go@1.24.0
    - node@22.16.0
    - python@3.14.4
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
